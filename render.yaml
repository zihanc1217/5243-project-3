services:
  - type: web
    name: ab-test-website
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: AB_DB_PATH
        value: /var/data/ab_test.db
    disk:
      name: ab-data
      mountPath: /var/data
      sizeGB: 1
